# --- Ziel wartet auf eine fremde Zutat: WIEDER EINGESCHALTET (2026-10-29) ----
# Der Eintrag stand hier bis zum 2026-10-26 und hat den Host beim Start mit
# einer Warnung belegt:
#
#   dsh: warning: 1 entry did not activate goal-await (…/patches/goal-await.mjs):
#   Error: cannot set property "goalAwait" without provide
#   at new apply (…/patches/goal-await.mjs:449) …
#
# Ursache, gemessen: Cordis' `ctx.set(name, value)` setzt einen Dienst, der in
# DIESEM Fiber zuvor mit `ctx.provide(name)` angemeldet sein muss
# (cordis/lib/index.js:785). `goal-await.mjs` rief am Ende
# `ctx.set?.("goalAwait", …)` nur zur Diagnose — ohne vorheriges provide.
#
# Reparatur 2026-10-29, vom Menschen erlaubt: Der Diagnose-Dienst wird jetzt in
# `goal-await.mjs` mit `ctx.provide("goalAwait", …)` angemeldet und beim Abbau
# wieder abgemeldet; der bare `ctx.set` ist weg. Damit ist der Eintrag wieder
# scharf und das Werkzeug `await_goal_dependency` vorhanden.
#
# Wirkung: Ein Ziel, das auf eine fremde Zutat wartet (Nachricht einer anderen
# Sitzung, Hintergrundjob), wird entwaffnet und verbrennt keine Runden; die
# nächste eingehende Nachricht schaltet es von selbst wieder scharf, spätestens
# nach `maxWaitSeconds`.
#
# Zurueck: den Block unten auskommentieren und `dsh web` neu starten.
#
- insert:
    - id: goal-await
      name: '../../patches/goal-await.mjs'
      config:
        maxWaitSeconds: 900

# stille-nachrichten — eine Direkt-Nachricht an ein Teammitglied, ohne Kaskade
# (Anordnung des Menschen 2026-10-30, sinngemaess woertlich): "Es darf keine
# Menschen nachahmende Kommunikation geben. Es muss eine Agent-first
# ausgekluegelte Kommunikation geben, die ganz gezielt bestimmt, wer wann wen
# anschreiben darf." Jede Diskussion mit einem Experten loesert bisher eine
# Kaskade: der Lead wird gefragt, antwortet, meldet zurueck — "einfach nur
# Energieverschwendung". Der Lead darf auf eine Nachricht auch nicht mit
# "ich habe deine Nachricht bekommen" antworten.
#
# Ursache, gemessen: `@deepseek-ai/dsh-experimental-tool-agent-team` schreibt in
# jedes Mitglied einen Reminder (Zeile 87–88: "To message your Team Lead, use
# send_message({target:'lead'})") und der Lead-Policy-Text verlangt, dass der
# Lead auf jedes Mitglied wartet. Ein `send_message` hat ausserdem nur die
# Felder `target` und `message`; das Ergebnis ist ein Schema mit
# `additionalProperties:false`, kann also keinen Hinweis an den Absender tragen.
#
# Wirkung: `send_message` bekommt das optionale Feld `quiet`. Mit `quiet: true`
# traegt die Nachricht einen Vermerk, der dem Empfaenger sagt: diese Nachricht
# ist nur fuer dich, antworte in diesem Thread, und melde sie dem Lead NICHT.
# Der Absender bekommt den Hinweis im Werkzeug-Ergebnis. Die Kaskaden-Regel geht
# in den System-Prompt jedes Mitglieds und des Leads; `spawn_teammate` haengt sie
# dem Auftrag an. Ohne `quiet` bleibt jede Nachricht genau wie vorher.
#
# Selbstpruefung: node ~/.dsh/patches/stille-nachrichten.mjs
# Nachsehen:      ~/.dsh/logs/stille-nachrichten.log
# Zurueck:        diesen Eintrag entfernen und DSH neu starten
- insert:
    - id: stille-nachrichten
      name: '../../patches/stille-nachrichten.mjs'

# cache-boundary — die vierte Cache-Marke an der Checkpoint-Grenze (Layer-Cake,
# 2026-10-29). Der Adapter `anthropic-messages.js` in `@earendil-works/pi-ai`
# setzt heute genau drei Marken (System-Prompt, letzte Werkzeug-Definition,
# letzte Nachricht); Anthropic erlaubt vier. Die vierte an der Checkpoint-
# Nachricht — der Etappengrenze, die `source.kind === "compact-checkpoint"`
# trägt — ist der Kern des Layer-Cake: alles vor ihr bleibt byte-gleich und
# cache-gültig. Der Patch setzt die Marke beim Start in der Adapterdatei und
# nimmt sie beim Abbau zurück. Gilt nur für Anthropic-Routen (homepc/Strata
# ignoriert cache_control vollständig, dort wirkt das 16384-Raster und der
# Schalter --prompt-cache-tail). Trockenlauf: node ~/.dsh/patches/cache-boundary-test.mjs.
#
# Die Zeile selbst steht seit 2026-10-29 im Bundling `@tmielsch/strata-caching`
# (`node_modules/@tmielsch/strata-caching/cordis.patch.yml`), das die Datei aus
# dem Paketverzeichnis lädt. Der Profil-Block war doppelt und ist gelöscht; das
# Bundling ist die einzige Quelle. Zurueck: Bundling entfernen und `dsh web` neu
# starten. Die Patch-Datei `~/.dsh/patches/cache-boundary.mjs` bleibt als
# Trockenlauf- und Rückhol-Quelle in ~/.dsh/patches.

# --- Pruner aus den drei verschifften Presets verbannt (Anordnung 2026-10-29) ---
# Der Werkzeug-Ergebnis-Pruner (`tool-result-pruner`) schreibt jedes Werkzeug-
# Ergebnis ueber 8192 Zeichen an seiner eigenen Position um: ein `tool/result`
# mit `surfaceOp` replace und `shadowedRange {start:seq,end:end}`. Das aendert
# den Prompt mitten drin, und der Preis ist die Zeit, den Abschnitt nach der
# Aenderung neu zu lesen — gemessen 41,5 Sekunden fuer 112543 Token. Der Pruner
# war in der Hauptsitzung schon deaktiviert, lief aber in den Presets `standard`,
# `ptc` und `cordis` und damit in jeder Delegations- und Teammitglied-Sitzung.
#
# Der Loader adressiert nur Top-Level-Reihen, und Gruppen INNERHALB einer
# Preset-`config` sind von aussen nicht erreichbar. Ein Top-Level-Override
# `- id: tool-result-pruner` + `disabled: true` wirkt nicht auf die verschachtelte
# Zeile (gemessen: Diff gegen den Ist-Stand war leer), und `- id: compaction` +
# `insert:` antwortet `patch insert: entry "compaction" not found`. Der einzige
# Weg, der bleibt: die Preset-Reihe per `id` ueberschreiben und ihre `config`
# vollstaendig neu hinschreiben — `config` wird komplett ersetzt, nie tief
# zusammengefuehrt. Die drei Reihen sind aus `dsh --profile web --dump-config`
# kopiert, jede Pruner-Zeile bekam `disabled: true`; sonst ist nichts geaendert.
#
# Wartungsfall: Diese Kopie friert den Preset-Inhalt der verschifften Bundles ein.
# Nach einem dsh-Update gewinnt die Kopie im Profil, also kann eine neue Plugin-Zeile
# des Bundles fehlen. Nach jedem Update: `dsh --profile web --dump-config` gegen die
# Bundle-Dateien in
# /opt/homebrew/lib/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-web-app/presets/
# vergleichen und die drei Reihen hier neu aus dem Dump kopieren.
#
# Zurueck: die drei Blocks unten auskommentieren und `dsh web` neu starten.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: |-
            You are a coding agent powered by the {{model}} model.
            Plane Werkzeugaufrufe, bevor du sie schickst. Überlege dir im Denken vollständig, welche Werkzeuge und Befehle du brauchst, welche davon voneinander unabhängig sind und in welcher Reihenfolge die abhängigen laufen müssen. Bündle die unabhängigen Schritte in einem Zug mit mehreren Aufrufen. Schick nicht einen Aufruf, warte auf sein Ergebnis und schick erst dann den nächsten, wenn der nächste nicht vom Ergebnis abhängt. Denk bei jedem Befehl, den du parallel startest, daran, dass er dafür geeignet sein muss: Lesende Befehle sind unkritisch, schreibende nicht. Ist ein Befehl dafür ungeeignet, führe ihn in einem späteren Schritt allein aus.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: >
                You are in plan mode. Stay in plan mode until exit_plan_mode
                succeeds or the user switches the session mode. Imperative
                language to implement changes means plan the implementation, not
                execute it. A user's conversational agreement — including an
                answer confirming something you asked — approves nothing and
                does not end plan mode; fold the confirmed decision into the
                plan and submit it through exit_plan_mode.


                Explore first. Use non-mutating reads, searches, static
                analysis, and checks to ground the plan in the actual
                repository. Do not edit or write files, change configuration,
                run formatters or code generation that rewrites tracked files,
                commit, or otherwise carry out the plan. Prefer existing
                functions and patterns over new machinery.


                The tool catalog stays the same across modes for request-cache
                stability. These plan-mode rules override any later tool
                description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do
                not use todo_write to track this planning phase: it tracks
                implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.


                Resolve discoverable facts by inspection. Use ask_user_question
                only for user-owned choices or material ambiguity that
                inspection cannot answer. Do not ask the user where code lives
                or how current behavior works when you can find out.


                Make the plan decision-complete: state the goal and success
                criteria; group implementation changes by subsystem; identify
                public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit
                assumptions. Keep it concise enough to review but detailed
                enough that another engineer can implement it without making
                design decisions.


                When ready, call exit_plan_mode with the complete plan markdown,
                starting with a # title. Make exit_plan_mode the only and final
                tool call in that assistant response: it presents the plan for
                approval, and implementation begins only in a later step after
                approval. Do not paste the final plan as a plain reply or ask
                "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again.
                If the review channel is unavailable or aborted, stay in plan
                mode and ask the user to switch modes manually; do not proceed
                with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          # 2026-10-30: automatische Verdichtung aus, wie in der Hauptsitzung
          # (Compaction nur am Zug-Ende, nie als Antwort; siehe Kommentar oben).
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              auto: false
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            disabled: true
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true

