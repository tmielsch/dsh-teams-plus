# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# NOTE: To CREATE new entries (rather than override an existing one by id),
# this file must use `insert:` at the top level. An entry written directly
# with `id` + `name` + `config` is treated as an override of an already
# present row and is silently skipped if that id has no base row.

# MCP servers, ported from opencode.jsonc.
- insert:
    # Web search MCP server (enabled).
    - id: mcp-web-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: web_search
        transport: stdio
        command: !!js 'process.platform === "win32" ? "npx.cmd" : "npx"'
        args: [ '-y', 'mcp-web-hound' ]

    # KiCad MCP server: kept available but disabled by default (loads ~100 tools).
    # Enable by setting `disabled: false` (or deleting the line) and touching the
    # file; the web profile reloads patches live.
    - id: mcp-kicad
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: kicad
        transport: stdio
        command: node
        args: [ 'dist/index.js' ]
        cwd: 'C:\Users\TM\KiCAD-MCP-Server'
        env:
          KICAD_PYTHON: 'C:\Program Files\KiCad\10.0\bin\python.exe'
          KICAD_PATH: 'C:\Program Files\KiCad\10.0'
          PYTHONPATH: 'C:\Program Files\KiCad\10.0\bin\Lib\site-packages'

