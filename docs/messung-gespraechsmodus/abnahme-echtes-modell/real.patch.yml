- id: headless-runner
  disabled: true
- id: headless-startup
  disabled: true
- id: agent-default-model
  config:
    provider: pcserve
    model: swift-1.5-iq2_xs
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      pcserve:
        apiKeyEnv: PCSERVE_API_KEY
        api: openai-completions
        baseURL: http://pcserve.xantu-truck.ts.net:8080/v1
        defaultInput: [text, image]
        models:
          - id: swift-1.5-iq2_xs
            name: swift-1.5-iq2_xs
            contextWindow: 512000
            maxTokens: 65536
            reasoningEfforts: { low: low, medium: medium, xhigh: xhigh }
- insert:
    - id: goal-await
      name: '/Users/tmielsch/dsh-teams-plus/.worktrees/umsetzung-team-modus/patches/goal-await.mjs'
    - id: team-modus
      name: '/Users/tmielsch/dsh-teams-plus/.worktrees/umsetzung-team-modus/patches/team-modus.mjs'
    - id: probe-abnahme-real
      name: '/tmp/teams_plus_umbau/probe/abnahme_real.mjs'
